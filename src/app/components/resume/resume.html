<section id="resume" class="py-20 px-6 relative overflow-hidden">
  <!-- Background Accents & Pattern -->
  <div class="absolute inset-0 pointer-events-none">
    <div class="absolute inset-0 bg-[radial-gradient(#334155_1px,transparent_1px)] [background-size:16px_16px] opacity-20"></div>
    <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[800px] h-[300px] bg-gradient-to-r from-blue-600/20 to-cyan-500/20 blur-[100px] rounded-full"></div>
  </div>

  <div class="container mx-auto max-w-4xl relative z-10">
    @if (isVisible) {
      <div @reveal #tiltCard 
           (mousemove)="onMouseMove($event)" 
           (mouseleave)="onMouseLeave()"
           class="bg-slate-800/60 backdrop-blur-xl border border-white/10 p-10 md:p-14 rounded-3xl shadow-2xl flex flex-col md:flex-row items-center justify-between gap-8 hover:border-cyan-500/40 transition-colors duration-500 group" style="transform-style: preserve-3d;">
      
      <div class="text-center md:text-left flex-1">
        <!-- File Metadata Badge -->
        <div class="inline-flex items-center gap-2 px-3 py-1 bg-cyan-500/10 border border-cyan-500/20 text-cyan-400 text-xs font-mono rounded-full mb-4">
          <span class="w-2 h-2 rounded-full bg-cyan-500 animate-pulse"></span>
          Updated August 2026 • PDF (120KB)
        </div>
        
        <h2 class="text-3xl md:text-4xl font-bold mb-4 flex items-center justify-center md:justify-start gap-3">
          <span class="text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-blue-500">
            Grab My Resume
          </span>
        </h2>
        <p class="text-slate-400 text-lg">
          Want to know more about my experience and skills in detail? Download my complete resume in PDF format.
        </p>
      </div>

      <div class="flex-shrink-0 flex flex-col sm:flex-row items-center gap-4 relative z-10">
        
        <!-- Secondary View Button -->
        <a href="/assets/satya_resume.pdf" target="_blank" class="px-6 py-4 rounded-full text-slate-300 font-semibold hover:text-cyan-400 hover:bg-slate-800/50 transition-colors border border-transparent hover:border-white/10 hidden sm:block">
          View in Browser
        </a>

        <!-- Primary Download Button Wrapper -->
        <div class="relative group/btn">
          <!-- Glow effect behind button -->
          <div class="absolute -inset-1 bg-gradient-to-r from-cyan-400 to-blue-600 rounded-full blur opacity-40 group-hover/btn:opacity-75 transition duration-500 group-hover/btn:duration-200"></div>
          
          <!-- Button -->
          <a href="/assets/satya_resume.pdf" download class="relative inline-flex items-center gap-3 px-8 py-4 bg-slate-900 rounded-full text-white font-bold hover:bg-slate-800 transition-colors border border-white/10 group-hover/btn:border-cyan-500/50">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-cyan-400 group-hover/btn:animate-bounce">
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
              <polyline points="7 10 12 15 17 10"/>
              <line x1="12" x2="12" y1="15" y2="3"/>
            </svg>
            Download PDF
          </a>
        </div>
      </div>

    </div>
    }
  </div>
</section>
