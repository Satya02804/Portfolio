<section class="min-h-[80vh] flex items-center justify-center relative overflow-hidden px-6">
  
  <!-- Decorative background glow -->
  <div class="absolute top-1/4 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[600px] h-[600px] bg-cyan-500/20 rounded-full blur-[120px] pointer-events-none"></div>
  <div class="absolute bottom-0 right-0 w-[400px] h-[400px] bg-blue-600/20 rounded-full blur-[100px] pointer-events-none"></div>

  <div class="container mx-auto text-center relative z-10">
    
    <!-- Using the name signal from our service -->
    <h1 class="text-5xl md:text-7xl font-extrabold tracking-tight mb-6">
      Hi, I'm <br class="md:hidden"/> 
      <span class="bg-gradient-to-r from-cyan-400 via-blue-500 to-purple-600 bg-clip-text text-transparent">
        {{ portfolio.name() }}
      </span>
    </h1>

    <h2 class="text-2xl md:text-3xl text-slate-300 font-medium mb-8">
      {{ portfolio.role() }}
    </h2>

    <p class="text-lg md:text-xl text-slate-400 max-w-2xl mx-auto mb-12">
      {{ portfolio.summary() }}
    </p>

    <div class="flex flex-col sm:flex-row gap-4 justify-center items-center">
      <a href="#projects" class="px-8 py-4 rounded-full bg-cyan-500 hover:bg-cyan-400 text-slate-900 font-semibold transition-all hover:scale-105 shadow-[0_0_20px_rgba(6,182,212,0.4)]">
        View My Work
      </a>
      <a href="#contact" class="px-8 py-4 rounded-full bg-white/10 hover:bg-white/20 border border-white/20 text-white font-semibold transition-all backdrop-blur-sm">
        Contact Me
      </a>
    </div>

  </div>
</section>
