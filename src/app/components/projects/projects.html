<section id="projects" class="py-20 px-6 scroll-mt-24">
  <div class="container mx-auto max-w-6xl">

    <div class="text-center mb-16">
      <h2 class="text-4xl font-bold mb-4">Featured Projects</h2>
      <div class="w-24 h-1 bg-cyan-500 mx-auto rounded-full"></div>
    </div>

    <!-- Grid of Projects -->
    <div class="grid md:grid-cols-2 lg:grid-cols-3 gap-8">

      <!-- Using Angular's @for to loop through our projects -->
      @for (project of portfolio.projects(); track project.title + project.type) {
        <div class="group bg-slate-800/40 rounded-2xl p-8 border border-white/10 hover:border-cyan-500/50 transition-all hover:-translate-y-2 hover:shadow-[0_10px_30px_rgba(6,182,212,0.15)] flex flex-col h-full relative overflow-hidden">

          <!-- Subtle top gradient -->
          <div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-cyan-400 to-blue-500 opacity-0 group-hover:opacity-100 transition-opacity"></div>

          <!-- Content -->
          <h3 class="text-2xl font-bold text-white mb-2">{{ project.title }}</h3>
          <p class="text-cyan-400 text-sm font-medium mb-6">{{ project.type }}</p>

          <ul class="text-slate-400 text-sm space-y-3 mb-8 flex-grow">
            @for (point of project.points; track point) {
              <li class="flex items-start gap-2">
                <span class="text-cyan-500 mt-1">▹</span>
                <span>{{ point }}</span>
              </li>
            }
          </ul>

          <!-- Tech Stack -->
          <div class="mt-auto pt-6 border-t border-white/5">
            <div class="flex flex-wrap gap-2 mb-6">
              @for (tech of project.techStack; track tech) {
                <span class="text-xs font-mono text-slate-300 bg-slate-900/50 px-2 py-1 rounded">
                  {{ tech }}
                </span>
              }
            </div>

            <a [href]="project.link" target="_blank" rel="noopener noreferrer" class="inline-flex items-center gap-2 text-cyan-400 hover:text-cyan-300 font-semibold transition-colors">
              <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-github"><path d="M15 22v-4a4.8 4.8 0 0 0-1-3.5c3 0 6-2 6-5.5.08-1.25-.27-2.48-1-3.5.28-1.15.28-2.35 0-3.5 0 0-1 0-3 1.5-2.64-.5-5.36-.5-8 0C6 2 5 2 5 2c-.3 1.15-.3 2.35 0 3.5A5.403 5.403 0 0 0 4 9c0 3.5 3 5.5 6 5.5-.39.49-.68 1.05-.85 1.65-.17.6-.22 1.23-.15 1.85v4"/><path d="M9 18c-4.51 2-5-2-7-2"/></svg>
              View Source
            </a>
          </div>

        </div>
      }

    </div>

  </div>
</section>
